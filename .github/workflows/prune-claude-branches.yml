name: Prune merged claude/* branches

# Why this is a workflow and not a Claude routine:
# Claude cloud sessions reach GitHub through Anthropic's CCR proxy, which returns
#   403 {"message":"Write access to this GitHub API path is not permitted through this proxy."}
# for ref DELETE. Pushes/updates are allowed; deletions are not. GitHub Actions
# runs with the repo's own GITHUB_TOKEN and no such proxy, so pruning belongs here.
# (Verified 2026-08-07 via git push --delete, colon-refspec, and raw curl DELETE.)

on:
  schedule:
    - cron: '25 * * * *'   # hourly, off the hour to avoid the :00 stampede
  workflow_dispatch:

permissions:
  contents: write        # required to delete refs
  pull-requests: read    # required to check for open PRs

concurrency:
  group: prune-claude-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully-merged claude/* branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "repo=$REPO  default branch=$BASE"

          deleted=0; kept=0
          # --paginate so repos with many branches are fully covered
          for b in $(gh api --paginate "repos/$REPO/branches" --jq '.[].name' | grep '^claude/' || true); do
            ahead=$(gh api "repos/$REPO/compare/$BASE...$b" --jq '.ahead_by' 2>/dev/null || echo "?")
            prs=$(gh pr list -R "$REPO" --head "$b" --state open --json number -q 'length' 2>/dev/null || echo 0)

            if [ "$ahead" = "0" ] && [ "$prs" = "0" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null
              echo "deleted  $b  (merged, no open PR)"
              deleted=$((deleted+1))
            else
              echo "kept     $b  (ahead=$ahead, openPRs=$prs)"
              kept=$((kept+1))
            fi
          done

          echo "---"
          echo "deleted=$deleted kept=$kept"
          {
            echo "### Prune merged \`claude/*\` branches"
            echo ""
            echo "- default branch: \`$BASE\`"
            echo "- deleted: **$deleted**"
            echo "- kept (unmerged or has an open PR): **$kept**"
          } >> "$GITHUB_STEP_SUMMARY"
